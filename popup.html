<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>麦可思自动理想化教评助手</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #1f2937;
    }
    .header {
      background: linear-gradient(135deg, #255be8 0%, #4f46e5 100%);
      color: #fff;
      padding: 14px 16px;
    }
    .header h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }
    .header p {
      margin: 0;
      font-size: 11px;
      opacity: 0.9;
    }
    .container {
      padding: 14px 16px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-test {
      background: linear-gradient(135deg, #0ac86c 0%, #059669 100%);
      color: #fff;
    }
    .btn-auto {
      background: linear-gradient(135deg, #255be8 0%, #4f46e5 100%);
      color: #fff;
    }
    .btn-copy {
      background: #e0e7ff;
      color: #255be8;
    }
    .status {
      font-size: 12px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .preview-box {
      max-height: 220px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .q-item {
      border-bottom: 1px dashed #e5e7eb;
      padding: 6px 0;
    }
    .q-item:last-child {
      border-bottom: none;
    }
    .q-title {
      font-weight: 600;
      color: #111827;
    }
    .q-ans {
      color: #059669;
      font-weight: 700;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>✨ 教学质量管理平台 · 自动教评助手</h2>
    <p>理想化最优选项：非常满意 / 没有违反规定 / 课程很丰富</p>
  </div>
  <div class="container">
    <div class="status" id="status-text">
      请在麦可思教评页面点击下方按钮进行第一轮测试（不提交问卷）或全自动完成教评。
    </div>
    <button class="btn btn-test" id="btn-test">🧪 第一轮测试（仅填写·不提交）</button>
    <button class="btn btn-auto" id="btn-auto">🚀 自动完成全部教评（自动提交）</button>
    <button class="btn btn-copy" id="btn-copy" style="display:none;">📋 复制第一轮测试答案（Markdown）</button>
    <div class="preview-box" id="preview-box" style="display:none;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
